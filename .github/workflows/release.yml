name: Release

# A pushed tag vMAJOR.MINOR.PATCH runs CI, checks the tag against the package
# version and the changelog, publishes to PyPI, then creates the GitHub release
# with the changelog section as its notes and the built files attached.
#
# PyPI upload uses trusted publishing (OIDC). No API token exists. PyPI accepts
# uploads only from this workflow file and the `pypi` environment.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(uv version --short)" = "$TAG"
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/changelog_section.py "$TAG" > release-notes.md
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            release-notes.md

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$TAG"
          --notes-file release-notes.md
          --verify-tag
