name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # macOS: the tests use /usr/bin/xattr for the quarantine attribute.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run mypy
      - run: uv run pytest
      - name: Licence check (runtime dependencies only)
        run: uv run --no-dev python scripts/check_licenses.py
